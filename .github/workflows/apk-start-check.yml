name: APK start check

# Starts an app from the newest RG477M Daijishou setup in an emulator (arm64 code runs under
# the image's translation) and prints the crash log: a crash at start without the device.

on:
  workflow_dispatch:
    inputs:
      apk:
        description: APK name in the setup's APKs folder
        default: Dolphin-MMJR2-477M.apk
      package:
        description: Its package
        default: org.dolphinemu.mmjr.rg477m
      after:
        description: A shell command run on the device after the start (adb shell)
        default: ''

# the setup is a draft release, which only a token that can write sees
permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid=$(gh api "repos/${{ github.repository }}/releases?per_page=10" -q '[.[]|select(.name|startswith("RG477M Daijishou"))][0].id')
          aid=$(gh api "repos/${{ github.repository }}/releases/$rid/assets" -q '.[0].id')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o setup.zip \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$aid"
          unzip -j -q setup.zip "RG477M Daijishou setup/APKs/${{ inputs.apk }}" -d .
          rm setup.zip
          ls -l *.apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          AFTER: ${{ inputs.after }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r -g "${{ inputs.apk }}"
            adb logcat -c
            adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "=== running?"; adb shell pidof ${{ inputs.package }} || echo "not running"
            if [ -n "$AFTER" ]; then echo "=== after"; adb shell "$AFTER" || true; fi
            echo "=== crash buffer"; adb logcat -d -b crash
            echo "=== app log"; adb logcat -d | grep -iE "AndroidRuntime|FATAL|DEBUG|libc|${{ inputs.package }}|dolphin|linker|UnsatisfiedLink" | tail -150

name: RetroArch pad check

# Starts the setup's RetroArch the way a Daijishou card does (the game in the intent) with a
# virtual Xbox-style gamepad (tools/vpad) and a test ROM whose screen goes black while a button
# is held (tools/padrom), then reads the screen with the button up and down: whether a game
# started from outside hears the controller.

on:
  workflow_dispatch:
    inputs:
      apk:
        description: APK name in the setup's APKs folder
        default: RetroArch.apk
      package:
        description: Its package
        default: com.retroarch.rg477m
      extra_cfg:
        description: Lines added to retroarch.cfg before the start (\n between them)
        default: ''

# the setup is a draft release, which only a token that can write sees
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The APK, the pad and the ROM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid=$(gh api "repos/${{ github.repository }}/releases?per_page=10" -q '[.[]|select(.name|startswith("RG477M Daijishou"))][0].id')
          aid=$(gh api "repos/${{ github.repository }}/releases/$rid/assets" -q '.[0].id')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o setup.zip \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$aid"
          unzip -j -q setup.zip "RG477M Daijishou setup/APKs/${{ inputs.apk }}" -d .
          rm setup.zip
          gcc -static -O2 -o vpad tools/vpad/vpad.c
          python3 tools/padrom/make_padrom.py pad.gb
          printf '%b\n' "${{ inputs.extra_cfg }}" > extra.cfg
          ls -l *.apk vpad pad.gb

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          PKG: ${{ inputs.package }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb root; sleep 3
            adb install -r -g "${{ inputs.apk }}"
            adb shell appops set ${{ inputs.package }} MANAGE_EXTERNAL_STORAGE allow
            adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1; sleep 20
            adb shell am force-stop ${{ inputs.package }}; sleep 2
            echo "=== provisioned"; adb shell ls /sdcard/RetroArch /sdcard/RetroArch/config | head -30
            adb push extra.cfg /data/local/tmp/extra.cfg
            adb shell "cat /data/local/tmp/extra.cfg >> /sdcard/RetroArch/retroarch.cfg"
            adb push pad.gb /sdcard/pad.gb
            adb push vpad /data/local/tmp/vpad
            adb shell chmod 755 /data/local/tmp/vpad
            adb shell "touch /data/local/tmp/cmd; nohup sh -c 'tail -f /data/local/tmp/cmd | /data/local/tmp/vpad' </dev/null >/dev/null 2>&1 &"
            sleep 3
            echo "=== pad"; adb shell dumpsys input | grep -iE "X-Box" | head -3
            adb logcat -c
            adb shell am start -n ${{ inputs.package }}/com.retroarch.browser.retroactivity.RetroActivityFuture -e ROM /sdcard/pad.gb -e LIBRETRO /data/data/${{ inputs.package }}/cores/gambatte_libretro_android.so -e CONFIGFILE /storage/emulated/0/RetroArch/retroarch.cfg
            sleep 30
            adb exec-out screencap -p > up1.png
            adb shell "echo press 315 >> /data/local/tmp/cmd"; sleep 3
            adb exec-out screencap -p > down1.png
            adb shell "echo release 315 >> /data/local/tmp/cmd"; sleep 3
            adb exec-out screencap -p > up2.png
            adb shell "echo press 304 >> /data/local/tmp/cmd"; sleep 3
            adb exec-out screencap -p > down2.png
            adb shell "echo release 304 >> /data/local/tmp/cmd"; sleep 2
            adb shell input keyevent --longpress KEYCODE_ENTER & sleep 0.5; adb exec-out screencap -p > kbd.png; wait
            echo "=== running?"; adb shell pidof ${{ inputs.package }} || echo "not running"
            echo "=== RetroArch log"; adb shell "ls /sdcard/RetroArch/logs 2>/dev/null; cat /sdcard/RetroArch/logs/*.log 2>/dev/null" | grep -iE "autoconf|joypad|input|pad|poll|config" | tail -60
            echo "=== logcat"; adb logcat -d | grep -iE "RetroArch|AndroidRuntime|FATAL" | grep -iE "autoconf|input|pad|configured|FATAL|Exception" | tail -40

      - name: The screen with the button up and down
        if: always()
        run: |
          python3 - <<'PY'
          import zlib, struct, os
          def mean(path):
              if not os.path.exists(path): return None
              d = open(path, 'rb').read()
              w, h = struct.unpack('>II', d[16:24])
              ct = d[25]; bpp = {6: 4, 2: 3}[ct]
              idat = b''; i = 8
              while i < len(d):
                  n, t = struct.unpack('>I4s', d[i:i+8])
                  if t == b'IDAT': idat += d[i+8:i+8+n]
                  i += 12 + n
              raw = zlib.decompress(idat); stride = w * bpp
              # the middle third of the screen, row by row (filters undone)
              prev = bytearray(stride); tot = cnt = 0; p = 0
              for y in range(h):
                  f = raw[p]; line = bytearray(raw[p+1:p+1+stride]); p += 1 + stride
                  for x in range(stride):
                      a = line[x-bpp] if x >= bpp else 0; b = prev[x]; c = prev[x-bpp] if x >= bpp else 0
                      if f == 1: line[x] = (line[x] + a) & 255
                      elif f == 2: line[x] = (line[x] + b) & 255
                      elif f == 3: line[x] = (line[x] + (a + b) // 2) & 255
                      elif f == 4:
                          pa, pb, pc = abs(b - c), abs(a - c), abs(a + b - 2*c)
                          line[x] = (line[x] + (a if pa <= pb and pa <= pc else b if pb <= pc else c)) & 255
                  prev = line
                  if h // 3 <= y < 2 * h // 3:
                      for x in range(w // 3, 2 * w // 3, 7):
                          tot += sum(line[x*bpp:x*bpp+3]) / 3; cnt += 1
              return round(tot / cnt, 1)
          for n in ['up1', 'down1', 'up2', 'down2', 'kbd']:
              print(n, mean(n + '.png'))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra-pad-screens
          path: '*.png'

name: APK info

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run whose artifact to inspect
        required: true
      artifact:
        description: Artifact name
        required: true

permissions:
  contents: read
  actions: read

jobs:
  info:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Package, launcher and version
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          for f in apk/*.apk; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            "$aapt" dump badging "$f" | grep -E "^package:|launchable-activity|application-label:|sdkVersion|targetSdkVersion|native-code"
          done

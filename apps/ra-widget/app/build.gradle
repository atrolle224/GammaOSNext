plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rg477m.rawidget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rg477m.rawidget'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RG477M_KEYSTORE') ?: 'missing.keystore')
            storePassword 'android'
            keyAlias 'rg477m'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rg477m.osrspad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rg477m.osrspad'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RG477M_KEYSTORE') ?: 'missing.keystore')
            storePassword 'android'
            keyAlias 'rg477m'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // the helper is an executable shipped as lib*.so so Android installs it executable
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
